name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: game

jobs:
  verificar:
    name: Typecheck, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Sin LFS: el juego y las pruebas solo usan game/public, que está en git normal.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: game/.nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Formato y lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas rápidas
        run: npm test

      - name: Build
        run: npx vite build

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: game/dist
          retention-days: 7

  # Partidas completas simuladas, repartidas en ocho máquinas (unas dos partidas cada una).
  # Solo en main o a mano: cada partida tarda varios minutos.
  simulacion:
    name: Simulación · ${{ matrix.nombre }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: sondas de balance, archivo: balance-probes, patron: '.' }
          - { nombre: guerrero combate, archivo: campaign-warrior-combat, patron: '.' }
          - { nombre: guerrero fuego/agua, archivo: campaign-warrior-build, patron: 'reaches (fire|water) ' }
          - { nombre: guerrero tierra/aire, archivo: campaign-warrior-build, patron: 'reaches (earth|air) ' }
          - { nombre: mago fuego/agua, archivo: campaign-mage, patron: 'reaches (fire|water) ' }
          - { nombre: mago tierra/aire, archivo: campaign-mage, patron: 'reaches (earth|air) ' }
          - { nombre: arquero fuego/agua, archivo: campaign-archer, patron: 'reaches (fire|water) ' }
          - { nombre: arquero tierra/aire, archivo: campaign-archer, patron: 'reaches (earth|air) ' }
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: game/.nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Falla también si el patrón no selecciona ninguna prueba.
      - name: Simulaciones
        run: |
          node --experimental-strip-types --test --test-name-pattern="${{ matrix.patron }}" \
            tests/simulation/${{ matrix.archivo }}.test.ts | tee salida.txt
          grep -qE '^# pass [1-9]' salida.txt
